<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow PRO v2.1</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 25px;
            box-sizing: border-box;
        }

        .header-app {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--text-main); }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin: 2px 0 15px 0; }
        .badge-pro { background-color: var(--success); color: white; font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; }

        .selectors {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 12px;
        }

        .selector-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .selector-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            width: 70%;
            padding: 9px 32px 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: white;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active { background: var(--primary); color: white; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .card-box {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            background: #fafafa;
            text-align: center;
            margin-bottom: 20px;
        }

        .pista { font-size: 0.9rem; color: #d97706; margin-bottom: 15px; font-style: italic; }
        .frase-texto { font-size: 1.15rem; font-weight: bold; margin-bottom: 15px; }
        .blur-text { filter: blur(6px); user-select: none; transition: filter 0.3s ease; }
        .blur-text.revealed { filter: blur(0); }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-voltear { background: #e2e8f0; color: var(--text-main); }
        .btn-audio { background: #8b5cf6; color: white; }
        .btn-ia { background: var(--primary); color: white; }
        .btn-siguiente { background: var(--success); color: white; }

        .explicacion-ia {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: left;
            margin-top: 15px;
            color: #1e3a8a;
            display: none;
            line-height: 1.5;
        }

        /* Chat Estilos */
        .chat-container-box { display: flex; flex-direction: column; height: 260px; text-align: left; background: #fff; }
        .chat-mensajes { flex-grow: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; max-width: 85%; }
        .chat-msg.ia { background: #eff6ff; color: #1e3a8a; align-self: flex-start; border-left: 3px solid var(--primary); }
        .chat-msg.usuario { background: #f1f5f9; color: var(--text-main); align-self: flex-end; }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input-area input { flex-grow: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.85rem; outline: none; }
        .chat-input-area button { background: var(--primary); color: white; border: none; padding: 0 12px; border-radius: 8px; cursor: pointer; }

        /* Quiz Estilos */
        .quiz-pregunta { font-size: 1rem; font-weight: 600; margin-bottom: 10px; text-align: left; }
        .quiz-opcion { background: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 0.85rem; margin-bottom: 6px; width: 100%; }
        .quiz-mensaje { margin-top: 8px; font-size: 0.85rem; font-weight: 600; text-align: center; }

        footer { margin-top: 25px; text-align: center; color: var(--text-muted); font-size: 0.75rem; border-top: 1px solid var(--border); paddingTop: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-app">
            <div>
                <h1>LinguaFlow</h1>
                <div class="subtitle">Tarjetas infinitas + Audio + Quiz + IA</div>
            </div>
            <div class="badge-pro">PRO v2.1</div>
        </div>

        <div class="selectors">
            <div class="selector-group">
                <label>🌐 Idioma:</label>
                <select id="selectIdioma" onchange="cambiarIdiomaYTema()">
                    <option value="ingles">Inglés (English)</option>
                    <option value="aleman">Alemán (Deutsch)</option>
                    <option value="espanol">Español (Spanish)</option>
                    <option value="frances">Francés (Français)</option>
                    <option value="italiano">Italiano (Italiano)</option>
                </select>
            </div>
            <div class="selector-group">
                <label>🎯 Tema:</label>
                <select id="selectTema" onchange="cambiarIdiomaYTema()">
                    <option value="viajes">Viajes / Turismo</option>
                    <option value="cotidiano">Cotidiano / General</option>
                </select>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="cambiarTab('estudiar', this)">Estudiar</button>
            <button class="tab-btn" onclick="cambiarTab('favoritas', this)">⭐ Favoritas</button>
            <button class="tab-btn" onclick="cambiarTab('quiz', this)">🎮 Quiz IA</button>
            <button class="tab-btn" onclick="cambiarTab('chats', this)">💬 Chat IA</button>
        </div>

        <!-- SECCIÓN ESTUDIAR -->
        <div id="seccion-estudiar" class="view-section active">
            <div class="card-box">
                <div id="cardPista" class="pista">💡 Pista: Cargando...</div>
                <div id="cardFrase" class="frase-texto blur-text">Loading...</div>
                
                <button class="btn btn-voltear" onclick="voltearTarjeta()">👁️ Voltear / Revelar Frase</button>
                <button class="btn btn-audio" onclick="reproducirAudio()">🔊 Escuchar Pronunciación</button>
                <button class="btn btn-ia" onclick="mostrarExplicacion()">💡 Explicación detallada IA</button>
                
                <div id="explicacionBox" class="explicacion-ia"></div>
            </div>
            <button class="btn btn-siguiente" onclick="siguienteTarjeta()">✨ Siguiente tarjeta infinita</button>
        </div>

        <!-- SECCIÓN FAVORITAS -->
        <div id="seccion-favoritas" class="view-section">
            <div class="card-box">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Aquí aparecerán tus tarjetas guardadas.</p>
            </div>
        </div>

        <!-- SECCIÓN QUIZ -->
        <div id="seccion-quiz" class="view-section">
            <div class="card-box">
                <div class="quiz-pregunta" id="quizPregunta">Cargando desafío...</div>
                <div id="quizOpciones"></div>
                <div class="quiz-mensaje" id="quizMensaje"></div>
            </div>
            <button class="btn btn-siguiente" onclick="siguientePreguntaQuiz()">🔄 Siguiente Pregunta</button>
        </div>

        <!-- SECCIÓN CHAT IA (FUNCIONAL) -->
        <div id="seccion-chats" class="view-section">
            <div class="card-box chat-container-box">
                <div class="chat-mensajes" id="chatLog">
                    <div class="chat-msg ia"><strong>IA:</strong> ¡Hola! Escribe una frase abajo para practicar el idioma que seleccionaste.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Escribe tu mensaje..." onkeypress="if(event.key === 'Enter') enviarMensajeChat()">
                    <button onclick="enviarMensajeChat()">Enviar</button>
                </div>
            </div>
        </div>

        <footer>
            <strong>LinguaFlow PRO v2.1</strong><br>
            Elaborated by Williams Neira | Powered by AI
        </footer>
    </div>

    <script>
        const baseDatos = {
            ingles: {
                viajes: [
                    { pista: "Siempre intento aprender frases básicas antes de visitar un país nuevo.", frase: "I always try to learn a few basic phrases before visiting a new country.", explicacion: "✨ <strong>Traducción:</strong> Aprender frases básicas para turismo." },
                    { pista: "Hago la maleta ligera para no pagar equipaje extra.", frase: "I always try to pack light so I don't pay extra baggage fees.", explicacion: "✨ <strong>Concepto:</strong> Viajar ligero (Pack light)." }
                ],
                cotidiano: [
                    { pista: "Suelo pasar por el supermercado de camino a casa.", frase: "I usually stop by the grocery store on my way home.", explicacion: "✨ <strong>Concepto:</strong> Stop by (pasar por un lugar)." }
                ]
            },
            aleman: {
                viajes: [{ pista: "La cuenta, por favor.", frase: "Zahlen, bitte.", explicacion: "✨ <strong>Concepto:</strong> Pagar en un restaurante." }],
                cotidiano: [{ pista: "Buenos días.", frase: "Guten Morgen.", explicacion: "✨ Saludo matutino." }]
            },
            espanol: {
                viajes: [{ pista: "¿Dónde está la estación de tren?", frase: "¿Dónde está la estación de tren más cercana?", explicacion: "✨ Ubicación de transporte." }],
                cotidiano: [{ pista: "Me alegro de verte.", frase: "Me alegro mucho de verte hoy por aquí.", explicacion: "✨ Saludo casual." }]
            },
            frances: {
                viajes: [{ pista: "¿Dónde queda el museo?", frase: "Excusez-moi, où se trouve le musée?", explicacion: "✨ Cortesía al preguntar." }],
                cotidiano: [{ pista: "Que tengas un excelente día.", frase: "Passez une excellente journée.", explicacion: "✨ Desear buen día." }]
            },
            italiano: {
                viajes: [{ pista: "Quisiera pedir un café.", frase: "Vorrei ordinare un caffè, per favore.", explicacion: "✨ Pedir en cafetería." }],
                cotidiano: [{ pista: "¿Cómo ha ido tu día?", frase: "Come è andata la tua giornata finora?", explicacion: "✨ Conversación casual." }]
            }
        };

        let tarjetaActualIndex = 0;
        let revelada = false;

        function cambiarTab(tabName, btnElement) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`seccion-${tabName}`).classList.add('active');
            btnElement.classList.add('active');
            if (tabName === 'quiz') cargarPreguntaQuiz();
        }

        function obtenerDatosActuales() {
            const idioma = document.getElementById('selectIdioma').value;
            const tema = document.getElementById('selectTema').value;
            return baseDatos[idioma]?.[tema] || baseDatos.ingles.viajes;
        }

        function actualizarTarjeta() {
            const lista = obtenerDatosActuales();
            if (tarjetaActualIndex >= lista.length) tarjetaActualIndex = 0;
            const tarjeta = lista[tarjetaActualIndex];
            document.getElementById('cardPista').innerText = `💡 Pista: "${tarjeta.pista}"`;
            const fraseEl = document.getElementById('cardFrase');
            fraseEl.innerText = `"${tarjeta.frase}"`;
            fraseEl.classList.remove('revealed');
            revelada = false;
            document.getElementById('explicacionBox').style.display = 'none';
        }

        function voltearTarjeta() {
            revelada = !revelada;
            const fraseEl = document.getElementById('cardFrase');
            fraseEl.classList.toggle('revealed', revelada);
        }

        function siguienteTarjeta() {
            const lista = obtenerDatosActuales();
            tarjetaActualIndex = (tarjetaActualIndex + 1) % lista.length;
            actualizarTarjeta();
        }

        function reproducirAudio() {
            const lista = obtenerDatosActuales();
            const utterance = new SpeechSynthesisUtterance(lista[tarjetaActualIndex].frase);
            const codigos = { ingles: 'en-US', aleman: 'de-DE', espanol: 'es-ES', frances: 'fr-FR', italiano: 'it-IT' };
            utterance.lang = codigos[document.getElementById('selectIdioma').value] || 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function mostrarExplicacion() {
            const box = document.getElementById('explicacionBox');
            box.innerHTML = obtenerDatosActuales()[tarjetaActualIndex].explicacion;
            box.style.display = 'block';
        }

        function cambiarIdiomaYTema() {
            tarjetaActualIndex = 0;
            actualizarTarjeta();
        }

        // Chat funcional
        function enviarMensajeChat() {
            const input = document.getElementById('chatInput');
            const log = document.getElementById('chatLog');
            const texto = input.value.trim();
            if (!texto) return;

            log.innerHTML += `<div class="chat-msg usuario"><strong>Tú:</strong> ${texto}</div>`;
            input.value = "";
            log.scrollTop = log.scrollHeight;

            setTimeout(() => {
                const idioma = document.getElementById('selectIdioma').value;
                log.innerHTML += `<div class="chat-msg ia"><strong>IA:</strong> ¡Excelente práctica en ${idioma}! Sigue redactando más oraciones para perfeccionar tu nivel.</div>`;
                log.scrollTop = log.scrollHeight;
            }, 500);
        }

        // Quiz
        let quizIndexActual = 0;
        const preguntasQuiz = [
            { pregunta: '¿Qué significa "pack light" al viajar?', opciones: ["Viajar con mucho peso", "Viajar con poco equipaje", "Comprar boleto"], correcta: 1 },
            { pregunta: '¿Cómo se pide la cuenta en alemán?', opciones: ["Guten Morgen", "Zahlen, bitte", "Auf Wiedersehen"], correcta: 1 }
        ];

        function cargarPreguntaQuiz() {
            const q = preguntasQuiz[quizIndexActual];
            document.getElementById('quizPregunta').innerText = q.pregunta;
            const container = document.getElementById('quizOpciones');
            container.innerHTML = "";
            document.getElementById('quizMensaje').innerText = "";

            q.opciones.forEach((op, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-opcion';
                btn.innerText = op;
                btn.onclick = () => {
                    const mensaje = document.getElementById('quizMensaje');
                    if (idx === q.correcta) {
                        btn.style.background = "var(--success)";
                        btn.style.color = "white";
                        mensaje.style.color = "var(--success)";
                        mensaje.innerText = "¡Correcto! ¡Muy bien hecho!";
                    } else {
                        btn.style.background = "var(--error)";
                        btn.style.color = "white";
                        mensaje.style.color = "var(--error)";
                        mensaje.innerText = "Ups, prueba con otra opción.";
                    }
                };
                container.appendChild(btn);
            });
        }

        function siguientePreguntaQuiz() {
            quizIndexActual = (quizIndexActual + 1) % preguntasQuiz.length;
            cargarPreguntaQuiz();
        }

        window.onload = actualizarTarjeta;
    </script>
</body>
</html>
