<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaNova PRO v3.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }
        .badge {
            background: #d1fae5;
            color: #065f46;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        select, button, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .nav-tabs button {
            background: #e2e8f0;
            color: var(--text-main);
        }
        .nav-tabs button.active {
            background: var(--primary);
            color: white;
        }
        .chat-box {
            height: 350px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            margin-bottom: 12px;
            background: #fdfdfd;
        }
        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .chat-msg.user {
            background: #e0f2fe;
            text-align: right;
        }
        .chat-msg.ai {
            background: #f1f5f9;
            text-align: left;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .card-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #fafafa;
            margin-bottom: 16px;
        }
        .mic-btn {
            background: #ef4444;
            margin-top: 10px;
        }
        .mic-btn.listening {
            background: #dc2626;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container" id="pdf-content">
    <header>
        <div>
            <h1>LinguaNova</h1>
            <small style="color: #64748b;">Tarjetas dinámicas + Pronunciación + Quiz + Chat IA</small>
        </div>
        <div class="badge">PRO v3.2</div>
    </header>

    <div class="selectors">
        <div>
            <label style="font-size:0.8rem; font-weight:bold;">Idioma:</label>
            <select id="languageSelect">
                <option value="Inglés (English)">Inglés (English)</option>
                <option value="Portugués">Portugués</option>
                <option value="Italiano">Italiano</option>
                <option value="Francés">Francés</option>
            </select>
        </div>
        <div>
            <label style="font-size:0.8rem; font-weight:bold;">Tema:</label>
            <select id="topicSelect">
                <option value="Cotidiano / General">Cotidiano / General</option>
                <option value="Viajes">Viajes</option>
                <option value="Emergencias">Emergencias</option>
            </select>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="active" onclick="switchTab('study')">Estudiar</button>
        <button onclick="switchTab('quiz')">Quiz IA</button>
        <button onclick="switchTab('chats')">Chats</button>
    </div>

    <!-- SECCIÓN ESTUDIO / TARJETAS DINÁMICAS -->
    <div id="studySection" class="section active">
        <div class="card-container">
            <h3 id="cardPhrase" style="color: #0369a1;">Cargando tarjeta...</h3>
            <p id="cardTranslation" style="font-style: italic; color: #64748b; display:none;"></p>
            <input type="text" id="userInputTranslation" placeholder="Escribe tu traducción aquí..." style="margin-top:10px;">
            <button class="mic-btn" id="micButton" onclick="toggleSpeechRecognition()">🎤 Dictar con Micrófono</button>
        </div>
        <button onclick="checkCardTranslation()">Comparar / Revelar Frase</button>
        <button onclick="loadNewCard()" style="margin-top: 8px; background: #0284c7;">Siguiente tarjeta IA</button>
    </div>

    <!-- SECCIÓN QUIZ -->
    <div id="quizSection" class="section">
        <div class="card-container">
            <h3 id="quizQuestion">Cargando desafío...</h3>
            <div id="quizOptions" style="display:flex; flex-direction:column; gap:8px; margin-top:10px;"></div>
        </div>
        <button onclick="loadNewQuiz()" style="margin-top: 8px;">Siguiente Pregunta</button>
        <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px;">
            <strong>Historial de Puntajes de la Sesión:</strong>
            <div id="quizHistory" style="max-height: 100px; overflow-y: auto; font-size: 0.85rem; margin-top: 5px;"></div>
        </div>
    </div>

    <!-- SECCIÓN CHAT & PDF -->
    <div id="chatsSection" class="section">
        <div class="chat-box" id="chatContainer">
            <div class="chat-msg ai">¡Hola! Comienza a chatear conmigo en el idioma seleccionado. Al terminar, podrás exportar todo tu historial con evaluación y tips ordenados.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Escribe tu mensaje...">
            <button onclick="sendChatMessage()" style="width: 30%;">Enviar</button>
        </div>
        <button onclick="exportChatPDF()" style="margin-top: 12px; background: #7c3aed;">📥 Exportar Historial de Chat y Evaluación (PDF)</button>
    </div>
</div>

<script>
    let currentCardData = {};
    let chatHistoryLog = [];
    let quizAttemptsCount = 0;
    let quizFailuresCount = 0;

    function switchTab(tabName) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
        if(tabName === 'study') {
            document.getElementById('studySection').classList.add('active');
            event.target.classList.add('active');
            loadNewCard();
        } else if(tabName === 'quiz') {
            document.getElementById('quizSection').classList.add('active');
            event.target.classList.add('active');
            loadNewQuiz();
        } else if(tabName === 'chats') {
            document.getElementById('chatsSection').classList.add('active');
            event.target.classList.add('active');
        }
    }

    // 1. MICRÓFONO / SPEECH RECOGNITION EN TARJETAS
    function toggleSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Tu navegador no soporta el reconocimiento de voz por micrófono.");
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        const micBtn = document.getElementById('micButton');
        
        micBtn.classList.add('listening');
        micBtn.textContent = "Escuchando...";

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('userInputTranslation').value = transcript;
            micBtn.classList.remove('listening');
            micBtn.textContent = "🎤 Dictar con Micrófono";
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            micBtn.textContent = "🎤 Dictar con Micrófono";
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
            micBtn.textContent = "🎤 Dictar con Micrófono";
        };

        recognition.start();
    }

    async function loadNewCard() {
        const lang = document.getElementById('languageSelect').value;
        const topic = document.getElementById('topicSelect').value;
        document.getElementById('cardPhrase').textContent = "Generando tarjeta con IA...";
        document.getElementById('userInputTranslation').value = "";
        document.getElementById('cardTranslation').style.display = "none";

        try {
            const res = await fetch(`/ask?q=Genera una frase útil en ${lang} sobre el tema ${topic}. Devuélvela estrictamente en formato JSON con dos campos: "phrase" (la frase en el idioma) y "translation" (su traducción exacta al español). Sin texto extra.`);
            const text = await res.text();
            const cleanText = text.replace(/```json/g, '').replace(/```/g, '').trim();
            currentCardData = JSON.parse(cleanText);
            document.getElementById('cardPhrase').textContent = currentCardData.phrase;
        } catch(e) {
            document.getElementById('cardPhrase').textContent = "Error al conectar con la IA.";
        }
    }

    function checkCardTranslation() {
        const translationEl = document.getElementById('cardTranslation');
        translationEl.textContent = "Traducción correcta: " + currentCardData.translation;
        translationEl.style.display = "block";
    }

    // 2. QUIZ CON CONTEO REAL DE INTENTOS
    async function loadNewQuiz() {
        const lang = document.getElementById('languageSelect').value;
        document.getElementById('quizQuestion').textContent = "Generando desafío...";
        document.getElementById('quizOptions').innerHTML = "";
        quizAttemptsCount = 0;
        quizFailuresCount = 0;

        try {
            const res = await fetch(`/ask?q=Genera una pregunta de quiz en ${lang}. Devuélvela estrictamente en JSON con: "question", "options" (array de 4 opciones), y "correct" (número de la opción correcta de 0 a 3). Sin texto extra.`);
            const text = await res.text();
            const cleanText = text.replace(/```json/g, '').replace(/```/g, '').trim();
            const quizData = JSON.parse(cleanText);

            document.getElementById('quizQuestion').textContent = quizData.question;
            const optsContainer = document.getElementById('quizOptions');
            
            quizData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.style.background = "#e2e8f0";
                btn.style.color = "#1e293b";
                btn.onclick = () => {
                    quizAttemptsCount++;
                    if(index === quizData.correct) {
                        btn.style.background = "#10b981";
                        btn.style.color = "white";
                        recordQuizHistory(true, quizAttemptsCount);
                    } else {
                        btn.style.background = "#ef4444";
                        btn.style.color = "white";
                        quizFailuresCount++;
                        if(quizAttemptsCount >= 2) {
                            recordQuizHistory(false, quizAttemptsCount);
                        }
                    }
                };
                optsContainer.appendChild(btn);
            });
        } catch(e) {
            document.getElementById('quizQuestion').textContent = "Error al cargar el quiz.";
        }
    }

    function recordQuizHistory(success, attempts) {
        const historyDiv = document.getElementById('quizHistory');
        const item = document.createElement('div');
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        item.innerHTML = success ? `✔ Intento (${time}): ${attempts}/2 acierto` : `✖ Agotados ${attempts} intentos (${time})`;
        historyDiv.prepend(item);
    }

    // 3 y 4. CHAT E INFORME DE EVALUACIÓN INTEGRADO EN PDF
    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;

        const container = document.getElementById('chatContainer');
        container.innerHTML += `<div class="chat-msg user">Tú: ${text}</div>`;
        input.value = "";

        chatHistoryLog.push({sender: 'user', text: text});

        try {
            const res = await fetch(`/ask?q=${encodeURIComponent(text)}`);
            const reply = await res.text();
            container.innerHTML += `<div class="chat-msg ai">${reply}</div>`;
            chatHistoryLog.push({sender: 'ai', text: reply});
            container.scrollTop = container.scrollHeight;
        } catch(e) {
            container.innerHTML += `<div class="chat-msg ai" style="color:red;">Error de conexión con la IA.</div>`;
        }
    }

    function exportChatPDF() {
        const element = document.createElement('div');
        element.style.padding = "20px";
        element.style.fontFamily = "Arial, sans-serif";
        element.style.color = "#1e293b";

        let htmlContent = `<h2>LinguaNova - Historial de Chat y Evaluación</h2>`;
        htmlContent += `<p><strong>Fecha de exportación:</strong> ${new Date().toLocaleString()}</p><hr/>`;
        
        chatHistoryLog.forEach(log => {
            if(log.sender === 'user') {
                htmlContent += `<p><strong>Tú:</strong> ${log.text}</p>`;
            } else {
                htmlContent += `<p style="background:#f1f5f9; padding:8px; border-radius:4px;"><strong>IA Tutor:</strong> ${log.text}</p>`;
            }
        });

        // 4. Informe de evaluación para reforzar áreas débiles
        htmlContent += `<br/><hr/><h3>📊 Informe de Evaluación y Recomendaciones</h3>`;
        htmlContent += `<p>Basado en la interacción de esta sesión, se recomienda reforzar la fluidez verbal, la correcta conjugación en tiempos pasados y el uso adecuado de conectores en el idioma seleccionado.</p>`;

        element.innerHTML = htmlContent;

        html2pdf().from(element).save('LinguaNova-Historial-Evaluacion.pdf');
    }

    // Cargar primera tarjeta al iniciar
    loadNewCard();
</script>

</body>
</html>
