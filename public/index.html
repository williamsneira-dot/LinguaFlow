<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow PRO v2.0</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            padding: 25px;
        }

        /* CSS para que los selectores se vean modernos */
        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 1em;
            width: 70%;
            padding: 10px 30px 10px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .selector-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

        .chat-box { height: 200px; overflow-y: auto; border: 1px solid var(--border); padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #fdfdfd; }
        .chat-input-area { display: flex; gap: 5px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }

        .view-section { display: none; }
        .view-section.active { display: block; }
        .tab-btn { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        footer { margin-top: 25px; text-align: center; color: var(--text-muted); font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>LinguaFlow <span style="font-size:0.7rem; background:var(--success); color:white; padding:2px 5px; border-radius:4px;">PRO v2.0</span></h1>
        
        <div class="selectors" style="background:#f1f5f9; padding:15px; border-radius:12px; margin-bottom:20px;">
            <div class="selector-group">
                <label>🌐 Idioma:</label>
                <select id="selectIdioma">
                    <option value="ingles">Inglés</option>
                    <option value="aleman">Alemán</option>
                    <option value="espanol">Español</option>
                    <option value="frances">Francés</option>
                    <option value="italiano">Italiano</option>
                </select>
            </div>
            <div class="selector-group">
                <label>🎯 Tema:</label>
                <select id="selectTema">
                    <option value="viajes">Viajes</option>
                    <option value="cotidiano">Cotidiano</option>
                    <option value="negocios">Negocios</option>
                </select>
            </div>
        </div>

        <div class="nav-tabs" style="display:flex; gap:5px; margin-bottom:20px;">
            <button class="tab-btn active" onclick="cambiarTab('estudiar', this)">Estudiar</button>
            <button class="tab-btn" onclick="cambiarTab('chat', this)">💬 Chat IA</button>
        </div>

        <!-- Seccion Estudiar -->
        <div id="seccion-estudiar" class="view-section active">
            <div style="border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center;">
                <p id="tarjetaTexto">Presiona abajo para comenzar...</p>
                <button onclick="generarFrase()" style="background:var(--primary); color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">Siguiente Tarjeta</button>
            </div>
        </div>

        <!-- Seccion Chat -->
        <div id="seccion-chat" class="view-section">
            <div class="chat-box" id="chatLog">
                <p><strong>IA:</strong> Hola, escribe algo para practicar.</p>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribe aquí...">
                <button onclick="enviarMensaje()" style="background:var(--primary); color:white; border:none; padding:10px; border-radius:8px;">Enviar</button>
            </div>
        </div>

        <footer>Elaborated by Williams Neira | Powered by AI</footer>
    </div>

    <script>
        function cambiarTab(tabName, btn) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('seccion-' + tabName).classList.add('active');
            btn.classList.add('active');
        }

        function generarFrase() {
            const idioma = document.getElementById('selectIdioma').value;
            const frases = {
                ingles: "The weather is lovely today.",
                aleman: "Das Wetter ist heute schön.",
                espanol: "El clima está encantador hoy.",
                frances: "Le temps est charmant aujourd'hui.",
                italiano: "Il tempo è incantevole oggi."
            };
            document.getElementById('tarjetaTexto').innerText = frases[idioma];
        }

        function enviarMensaje() {
            const input = document.getElementById('chatInput');
            const log = document.getElementById('chatLog');
            if (!input.value) return;

            log.innerHTML += `<p><strong>Tú:</strong> ${input.value}</p>`;
            
            // Simulación de respuesta de IA
            setTimeout(() => {
                log.innerHTML += `<p><strong>IA:</strong> ¡Buen punto! Sigamos practicando ${document.getElementById('selectIdioma').value}.</p>`;
                log.scrollTop = log.scrollHeight;
            }, 500);
            
            input.value = "";
        }
    </script>
</body>
</html>
