<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow</title>
    <!-- Aquí van tus estilos CSS -->
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        select, button { padding: 10px; margin: 10px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button { background-color: #7c3aed; color: white; border: none; }
        button:hover { background-color: #6d28d9; }
        .card { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
    </style>
</head>
<body>

    <div class="container">
        <h1>LinguaFlow</h1>
        <p>Tarjetas infinitas + Audio + Quiz + IA</p>

        <!-- Selector de Idioma -->
        <label for="selector-idioma">Idioma:</label>
        <select id="selector-idioma">
            <option value="en">Inglés (English)</option>
            <option value="fr">Francés (French)</option>
            <option value="de">Alemán (German)</option>
            <option value="it">Italiano (Italian)</option>
            <option value="es">Español (Spanish)</option>
        </select>

        <div class="card">
            <!-- ID crítico donde se muestra la frase en el idioma original -->
            <p id="frase-en-idioma-original">The emergency kit was missing a flashlight...</p>
            
            <!-- Botón de Escuchar Pronunciación -->
            <button id="boton-escuchar" onclick="reproducirPronunciacion()">🔊 Escuchar Pronunciación</button>
        </div>
    </div>

    <!-- Script completo con la lógica unificada y universal -->
    <script>
        async function reproducirPronunciacion() {
            // Obtenemos el texto y el idioma seleccionado de forma dinámica
            const textoElemento = document.getElementById('frase-en-idioma-original');
            const selectorIdioma = document.getElementById('selector-idioma');
            const boton = document.getElementById('boton-escuchar');

            if (!textoElemento || !selectorIdioma) return;

            const texto = textoElemento.innerText;
            const idioma = selectorIdioma.value; // Ej: 'en', 'fr', 'de', etc.

            // Desactivar botón temporalmente para evitar saturación de clics
            if (boton) boton.disabled = true;

            try {
                // Utiliza el servicio de audio directo en la nube (funciona en Safari, iPhone, Android y Modo Incógnito)
                const urlAudio = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${idioma}&client=tw-ob&q=${encodeURIComponent(texto)}`;
                
                const audio = new Audio(urlAudio);
                
                // Reproducción asegurada mediante promesa para evitar bloqueos de iOS
                await audio.play();

            } catch (error) {
                console.error("Error al reproducir el audio:", error);
                alert("No se pudo reproducir el audio en este dispositivo.");
            } finally {
                if (boton) boton.disabled = false;
            }
        }
    </script>
</body>
</html>
